<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs — Oppora</title>
<meta name="description" content="Jobs with vetted employers across Africa and global teams hiring African talent — filter by location, work mode, experience, salary and skills.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="vendor/fonts/manrope/400.css"><link rel="stylesheet" href="vendor/fonts/manrope/600.css"><link rel="stylesheet" href="vendor/fonts/manrope/700.css"><link rel="stylesheet" href="vendor/fonts/manrope/800.css">
<link rel="stylesheet" href="vendor/fonts/sora/600.css"><link rel="stylesheet" href="vendor/fonts/sora/700.css"><link rel="stylesheet" href="vendor/fonts/sora/800.css">
<link rel="stylesheet" href="vendor/fonts/comfortaa/700.css">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="job" data-shell="public" data-cat="job">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-nav"></div>

<main id="main">
  <section class="page-hero">
    <div class="container-opp">
      <div class="row align-items-center g-4">
        <div class="col-lg-7">
          <span class="eyebrow"><i class="bi bi-briefcase"></i>Job board</span>
          <h1 class="mt-2">Jobs that respect your trajectory</h1>
          <p>Graduate trainships to senior roles — with salary ranges, work mode and experience level shown up front. <span id="catCount" class="fw-bold" style="color:var(--blue)"></span></p>
          <form class="hero-search mt-3" id="searchForm" role="search" style="max-width:560px">
            <i class="bi bi-search ms-2" style="color:var(--faint)"></i>
            <label class="visually-hidden" for="searchInput">Search jobs</label>
            <input class="hs-input" id="searchInput" type="search" placeholder="Search job titles, companies, skills…">
            <button class="btn-op btn-op-primary" type="submit"><i class="bi bi-search"></i>Search</button>
          </form>
          <div class="d-flex flex-wrap gap-2 mt-3">
            <a class="tag-chip" href="jobs.html"><i class="bi bi-building"></i>On-site</a>
            <a class="tag-chip" href="explore.html?cat=job&mode=hybrid"><i class="bi bi-arrow-left-right"></i>Hybrid</a>
            <a class="tag-chip" href="remote-work.html"><i class="bi bi-globe2"></i>Remote</a>
          </div>
        </div>
        <div class="col-lg-5 d-none d-lg-block">
          <img src="https://images.pexels.com/photos/1181360/pexels-photo-1181360.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200" alt="Professionals collaborating at a table" style="border-radius:22px;box-shadow:var(--sh-md);aspect-ratio:16/10;object-fit:cover;width:100%">
        </div>
      </div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container-opp">
      <div class="section-head mb-3"><h2 style="font-size:1.25rem">Closing soon</h2></div>
      <div class="row g-3" id="closingSoon"></div>
      <div class="section-head mt-4 mb-3"><h2 style="font-size:1.25rem">Hiring organisations</h2></div>
      <div class="d-flex flex-wrap gap-2" id="providers"></div>
    </div>
  </section>

  <section class="section-tight pt-0" id="resultsAnchor">
    <div class="container-opp">
      <div class="results-bar">
        <button class="btn-op btn-op-outline btn-op-sm filter-toggle-mobile" id="filterToggle"><i class="bi bi-funnel"></i>Filters</button>
        <span id="resultsBar"></span>
        <div class="active-chips" id="activeChips"></div>
        <div class="ms-auto d-flex align-items-center gap-2">
          <label class="small fw-bold" for="sortSel" style="color:var(--muted)">Sort</label>
          <select class="select-opp" id="sortSel" style="width:auto;padding:9px 36px 9px 12px;font-size:13.5px"></select>
        </div>
      </div>
      <div class="listing-layout">
        <aside class="filter-panel" id="filterPanel" aria-label="Job filters"></aside>
        <div><div class="opp-grid" id="resultsGrid"></div></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/category.js"></script>
</body>
</html>
