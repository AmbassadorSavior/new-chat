<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Chat with Oppora Assist: recommendations, deadlines, document checklists and eligibility guidance.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<body data-page="messages" data-shell="app">
<div class="d-flex flex-wrap gap-2 mb-3" id="quickRow" aria-label="Quick prompts"></div>
<div class="thread">
  <div class="thread-body" id="threadBody" aria-live="polite"></div>
  <form class="thread-input" id="msgForm">
    <label class="visually-hidden" for="msgInput">Message Oppora Assist</label>
    <input class="input-opp" id="msgInput" placeholder="Ask Oppora Assist anything…" autocomplete="off">
    <button class="btn-op btn-op-primary" id="sendBtn" type="submit" aria-label="Send message"><i class="bi bi-send"></i></button>
  </form>
</div>
